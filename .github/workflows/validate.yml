name: Validate Part 1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required Part 1 files
        run: |
          test -d docs
          test -f docs/ERD.PNG
          test -f docs/PROG.PDF
          test -f docs/SQLQUERY.sql
          echo "All required Part 1 files are present."